<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pablo z GSAP</title>
  
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.9/dist/lenis.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline>
    <source src="video/rzeki.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>

  <header class="navbar">
    <div class="logo">Pablo<span>.</span></div>
    
    <button class="hamburger" aria-label="Otwórz menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-links">
      <a href="#home">O mnie</a>
      <a href="#projects">Projekty</a>
      <a href="#contact">Kontakt</a>
    </nav>
  </header>

  <div class="scroll-wrapper" id="home">
    <main class="container">
      <p class="title">Emocje to Design<span class="span-title">.</span></p>
      <p class="subtitle">Tworzę animacje www.</p>
      <a href="#projects" class="arrow">→</a>    
    </main>
  </div>

  <section class="horizontal-container" id="projects">
    <div class="container-videos">
      
      <div class="video-item">
        <video class="gallery-video" autoplay muted loop playsinline>
          <source src="video/rzeki.mp4" type="video/mp4">
        </video>   
        <div class="video-content">
          <p class="gallery-description">Żywioły</p>    
        </div>
      </div>

      <div class="video-item">
        <video class="gallery-video" autoplay muted loop playsinline>
          <source src="video/ognisko.mp4" type="video/mp4">
        </video>  
        <div class="video-content">
          <p class="gallery-description">Wyzwalają</p>     
        </div>
      </div>

      <div class="video-item">
        <video class="gallery-video" autoplay muted loop playsinline>
          <source src="video/jeziora.mp4" type="video/mp4">
        </video>  
        <div class="video-content">
          <p class="gallery-description">Także</p>     
        </div>
      </div>

      <div class="video-item">
        <video class="gallery-video" autoplay muted loop playsinline>
          <source src="video/woda.mp4" type="video/mp4">
        </video>  
        <div class="video-content">
          <p class="gallery-description">Emocje<span class="span-title">.</span></p>     
        </div>
      </div>

    </div>
  </section>

  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  
  <script src="script.js"></script>
</body>
</html>
